<body>
<header class="top">
  <a class="logo" href="./" aria-label="Inicio"><img src="assets/logo-wordmark.png" alt="Tecno Log IA"></a>
  <div class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/></svg>
    <input id="q" type="search" placeholder="Buscar por código, producto, marca o categoría" autocomplete="off" enterkeyhint="search">
  </div>
  <button id="btnCart" class="cartbtn" aria-label="Carrito">
    <svg viewBox="0 0 24 24"><path d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zM5.2 4l.4 2H21l-2 8H7.4l-.4 2H19v2H5l1-4.2L3.4 2H1V0h3.2l.4 2z"/></svg>
    <span id="cartCount">0</span>
  </button>
</header>
<div class="ribbon">SOLO DISTRIBUIDORES Y MAYORISTAS <span id="vig"></span></div>
<div id="inst" class="inst" hidden><img src="assets/icon-192.png" alt=""><div><b>Instala el catálogo</b><br><span>Tenlo como ícono en tu celular</span></div><button class="btn red" id="btnInst">Instalar</button><button class="x" id="instNo" aria-label="Cerrar">✕</button></div>
<section id="ios" class="pv" hidden role="dialog"><div class="cobox" style="max-width:520px;height:auto;margin:auto;border-radius:18px;padding:24px"><h2 style="margin-top:0">Agregar a tu pantalla de inicio</h2><ol style="font-size:17px;line-height:1.6;padding-left:22px"><li>Toca el botón <b>Compartir</b> <span style="font-size:22px">⎋</span> (abajo en Safari).</li><li>Baja y elige <b>«Agregar a pantalla de inicio»</b>.</li><li>Toca <b>Agregar</b>. ¡Listo! Verás el ícono de Tecno Log IA.</li></ol><button class="btn" id="iosOk" style="width:100%">Entendido</button></div></section>

<main id="main"><div class="loading">Cargando catálogo…</div></main>

<!-- Ficha de producto: uno a la vez -->
<section id="pv" class="pv" hidden aria-modal="true" role="dialog"></section>

<!-- Modo presentación -->
<section id="play" class="play" hidden></section>

<!-- Carrito -->
<aside id="cart" class="drawer" hidden></aside>
<aside id="asesor" class="drawer asesor" hidden></aside>
<button id="btnAs" class="btnas" data-asesor hidden>✨ Asesor IA</button>

<!-- Orden de compra -->
<section id="co" class="pv" hidden aria-modal="true" role="dialog"></section>

<a id="wa" class="wa" target="_blank" rel="noopener" aria-label="WhatsApp">
  <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4a.5.5 0 0 0 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.4-.3z"/></svg>
</a>
<div id="toast" class="toast" hidden></div>
